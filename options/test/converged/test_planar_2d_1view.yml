name: test_converged_planar_2d_1view
model_type: SPECTModel
scale: 1
num_gpu: 0
manual_seed: 20020113

datasets:
  test:
    name: xcat_test_planar_2d_1view
    type: SPECTTrainDataset
    phase: test
    mode: paired
    input_layout: ap2
    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    dataroot_gt: datasets/spectH_XCAT_ideal_1x
    pattern_gt: "*.dat"
    pattern_lq: "*.dat"
    views: 2
    dtype: float32
    height: 1024
    width: 256
    posterior_flip: true
    view_sampler:
      mode: single_view
      view_indices: [0, 1]
    pack_mode: 2d_channel
    start_idx: 96
    end_idx: 100
    gt_scale_factor: 1.0
    max_value: 150.0
    norm:
      type: linear

network_g:
  type: UNetRes
  in_nc: 1
  out_nc: 1
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true

path:
  pretrain_network_g: experiments/converged_planar_2d_1view/models/net_g_latest.pth
  param_key_g: params_ema
  strict_load_g: true

val:
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr_range
      domain: count
      data_range: 150.0
      crop_border: 0
      test_y_channel: false
      better: higher

logger:
  print_freq: 1
  use_tb_logger: false
  wandb: null
