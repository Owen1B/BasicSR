name: test_converged_tomo_2d_nview
model_type: SPECTModel
scale: 1
num_gpu: 0
manual_seed: 20020113

datasets:
  test:
    name: spect229_test_tomo_2d_nview
    type: SPECTProjectionEvalDataset
    phase: test
    dataroot: datasets/SPECT229
    pattern: "**/*_Proj4Filter.dat"
    views: 60
    height: 128
    width: 128
    start_idx: 0
    end_idx: 4

network_g:
  type: UNetRes
  in_nc: 60
  out_nc: 60
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true

path:
  pretrain_network_g: experiments/converged_tomo_2d_nview/models/net_g_latest.pth
  param_key_g: params_ema
  strict_load_g: true

val:
  save_img: false
  pbar: false
  eval_networks: [ema]
  metrics:
    pll_mean:
      type: pll
      better: lower
      full: true
      eps: 1.0e-08

logger:
  print_freq: 1
  use_tb_logger: false
  wandb: null
