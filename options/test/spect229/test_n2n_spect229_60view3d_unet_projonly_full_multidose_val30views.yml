# Quick test config: run inference/metrics on only 30 views by subsampling every other view.
# - This does NOT change training; it is only for faster test/validation.
#
# Run:
#   cd /root/shared-nvme/BasicSR
#   PYTHONPATH="./:${PYTHONPATH}" CUDA_VISIBLE_DEVICES=0 \
#   python basicsr/test.py -opt options/test/spect229/test_n2n_spect229_60view3d_unet_projonly_full_multidose_val30views.yml

name: test_n2n_spect229_60view3d_unet_projonly_full_multidose_val30views
model_type: SPECT3DModel
scale: 1
num_gpu: 1
manual_seed: 20020113

datasets:
  test:
    name: SPECT229_val_projection
    type: SPECTProjectionDataset
    dataroot: datasets/SPECT229
    pattern: "**/*_Proj4Filter.dat"
    height: 128
    width: 128
    views: 60
    start_idx: 0
    end_idx: 4
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    pin_memory: true

# network
network_g:
  type: UNet3DRes
  in_nc: 1
  out_nc: 1
  nc: [16, 32, 64, 128]
  nb: 2
  bias: false
  global_residual: true
  circular_depth: true
  act: relu

# path
path:
  # Use the best checkpoint from the existing experiment.
  pretrain_network_g: /root/shared-nvme/BasicSR/experiments/n2n_spect229_60view3d_unet_projonly_full_multidose/models/net_g_best.pth
  param_key_g: params_ema
  strict_load_g: true

val:
  # Subsample views for inference/metrics: keep every other view -> 30 views
  view_stride: 2

  # Keep this test lightweight
  save_img: false
  generate_gif: false
  generate_mp4_thin_factors: false

  # Optional: compute PLL (Poisson NLL) as a quick self-supervised metric
  metrics:
    pll_mean:
      type: pll
      better: lower
      full: true
      eps: 1.0e-08

logger:
  print_freq: 50
  use_tb_logger: false
  wandb: null














