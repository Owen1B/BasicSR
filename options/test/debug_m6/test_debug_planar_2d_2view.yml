name: test_debug_m6_planar_2d_2view
model_type: SPECTModel
scale: 1
num_gpu: 0
manual_seed: 42

datasets:
  test:
    name: test_debug_m6_planar_2d_2view
    type: SPECTTrainDataset
    phase: test
    mode: poisson_thinning
    input_layout: ap2
    dataroot_gt: /home/owen/code/BasicSR/datasets/spectH_XCAT_poisson_1x
    pattern_gt: "*.dat"
    views: 2
    dtype: float32
    height: 1024
    width: 256
    posterior_flip: true
    view_sampler:
      mode: opposite_pair
      offset: 1
    pack_mode: 2d_channel
    start_idx: 0
    end_idx: 1
    gt_scale_factor: 1.0
    max_value: 150.0
    norm:
      type: linear

network_g:
  type: UNetRes
  in_nc: 2
  out_nc: 2
  nc: [8, 16, 32, 64]
  nb: 1
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true

path:
  pretrain_network_g: experiments/debug_m6_planar_2d_2view/models/net_g_latest.pth
  param_key_g: params_ema
  strict_load_g: true

val:
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 1
  use_tb_logger: false
  wandb: null
