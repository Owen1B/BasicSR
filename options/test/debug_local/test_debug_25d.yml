name: test_debug_local_25d
model_type: SPECTModel
scale: 1
num_gpu: 0
manual_seed: 42

datasets:
  test:
    name: test_debug_local_25d
    type: SPECTProjectionEvalDataset
    phase: test
    dataroot: /home/owen/code/BasicSR/datasets/SPECT229
    pattern: "**/*_Proj4Filter.dat"
    views: 60
    height: 128
    width: 128
    start_idx: 3
    end_idx: 4

network_g:
  type: UNetRes
  in_nc: 5
  out_nc: 5
  nc: [8, 16, 32, 64]
  nb: 1
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true

path:
  pretrain_network_g: experiments/debug_local_25d/models/net_g_latest.pth
  param_key_g: params_ema
  strict_load_g: true

val:
  save_img: false
  pbar: false
  eval_networks: [g]
  metrics:
    pll_mean:
      type: pll
      better: lower
      full: true
      eps: 1.0e-08

logger:
  print_freq: 1
  use_tb_logger: false
  wandb: null
