name: debug_local_3d_evalmp4_async
model_type: SPECTModel
scale: 1
num_gpu: 0
manual_seed: 42

datasets:
  train:
    name: debug_local_3d_train
    type: SPECTTrainDataset
    phase: train
    mode: poisson_thinning
    input_layout: volume
    dataroot_gt: /home/owen/code/BasicSR/datasets/SPECT229
    pattern_gt: "**/*_Proj4Filter.dat"
    views: 60
    height: 128
    width: 128
    dtype: uint16
    view_sampler:
      mode: n_views
      n_views: 60
      strategy: fixed
      start: 0
    pack_mode: 3d_depth
    max_value: 150.0
    gt_scale_factor: 1.0
    poisson_thinning_prob: 0.5
    poisson_thinning_random_swap: false
    poisson_thinning_round_mode: nearest
    start_idx: 0
    end_idx: 2
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    pin_memory: false
  val:
    name: debug_local_3d_val
    type: SPECTProjectionEvalDataset
    phase: val
    dataroot: /home/owen/code/BasicSR/datasets/SPECT229
    pattern: "**/*_Proj4Filter.dat"
    views: 60
    height: 128
    width: 128
    dtype: uint16
    start_idx: 2
    end_idx: 3
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    pin_memory: false

network_g:
  type: UNet3DRes
  in_nc: 1
  out_nc: 1
  nc: [4, 8, 16, 32]
  nb: 1
  bias: false
  global_residual: true
  circular_depth: true
  act: relu

path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null

train:
  pbar: false
  disable_cudnn: true
  amp:
    enable: false
    dtype: bf16
    loss_fp32: true
    use_scaler: false
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 1.0e-4
    weight_decay: 0
    betas: [0.9, 0.999]
  scheduler:
    type: MultiStepLR
    milestones: [1]
    gamma: 1
  total_iter: 1
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: 1
  save_img: false
  pbar: false
  eval_networks: [ema]
  save_best_ckpt: false
  metrics:
    pll_mean:
      type: pll
      better: lower
      full: true
      eps: 1.0e-08
  eval_mp4:
    enable: true
    every: 1
    max_samples: 1
    network: ema
    model_label: train_ema
    output_dir: experiments/{name}/visualization/eval_mp4
    thin_factors: [2, 3, 4, 5]
    require_cached: false
    allow_on_the_fly_cache: true
    with_bm3d: false
    turns: 1
    fps: 10
    crf: 18

logger:
  print_freq: 1
  save_checkpoint_freq: 1
  use_tb_logger: false
  wandb: null

dist_params:
  backend: nccl
  port: 29500
