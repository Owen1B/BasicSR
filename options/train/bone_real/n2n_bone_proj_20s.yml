# Noise2Noise 训练配置 - 真实骨 SPECT 投影数据 (20s)
# 在线 Poisson 采样：将 20s (1x) 分裂为两个 2x 快速扫描进行配对训练

name: n2n_bone_proj_20s
model_type: SPECT3DModel  # Use SPECT3DModel for automatic GIF generation during validation
scale: 1
num_gpu: 1
manual_seed: 20020113

# ============================================================================
# 数据集配置
# ============================================================================
datasets:
  train:
    name: Bone_train_n2n
    type: SPECTDatPairedDataset
    mode: n2n  # Noise2Noise 模式：在线 Poisson 采样
    dataroot_gt: datasets/bone_projection_20s_dat
    height: 128
    width: 128
    posterior_flip: false  # 数据已经是双通道，不需要翻转
    view_mode: stack2  # 双通道输入（anterior + posterior）
    start_idx: 0
    end_idx: 810  # 900 * 0.9 = 810 用于训练

    # Noise2Noise 在线 Poisson 采样
    n2n_p: 0.5  # 分裂比例（将 1x 分裂为两个 0.5x）
    n2n_random_swap: false  # 不随机交换（保持一致性）
    n2n_round: nearest  # 四舍五入到最近整数

    gt_scale_factor: 1.0
    max_value: 60.0  # 根据 P99.9 设定

    # 归一化：Linear（最佳配置）
    norm:
      type: linear

    # 数据增强
    gt_size: 64  # patch 大小（64×64 最佳）
    use_hflip: false  # 不使用水平翻转（解剖结构有方向性）
    use_rot: false  # 不使用旋转（解剖结构有方向性）

    # DataLoader
    num_worker_per_gpu: 8
    batch_size_per_gpu: 32  # batch32 最佳
    dataset_enlarge_ratio: 4  # 810*4/32 ≈ 101 iters/epoch
    pin_memory: true
    persistent_workers: true
    prefetch_mode: null

  val:
    name: Bone_val
    type: SPECTDatPairedDataset
    mode: n2n  # 验证时也用 N2N 模式（因为没有真值）
    dataroot_gt: datasets/bone_projection_20s_dat
    dataroot_lq: datasets/bone_projection_20s_dat  # 同一个数据集
    height: 128
    width: 128
    posterior_flip: false
    view_mode: stack2
    start_idx: 810  # 后 10% 用于验证
    end_idx: 900

    n2n_p: 0.5
    n2n_random_swap: false
    n2n_round: nearest

    gt_scale_factor: 1.0
    max_value: 60.0
    norm:
      type: linear

# ============================================================================
# 网络配置
# ============================================================================
network_g:
  type: UNetRes
  in_nc: 2  # 双通道输入（anterior + posterior）
  out_nc: 2  # 双通道输出
  nc: [64, 128, 256, 512]  # 通道数
  nb: 4  # 每层的 ResBlock 数
  act_mode: R  # ReLU
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true  # 全局残差连接

# ============================================================================
# 路径配置
# ============================================================================
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null

# ============================================================================
# 训练配置
# ============================================================================
train:
  ema_decay: 0.999
  pbar: true

  # 优化器：AdamW + weight_decay=1e-4（最佳配置）
  optim_g:
    type: AdamW
    lr: 0.0001
    weight_decay: 0.0001  # 防止过拟合的关键
    betas: [0.9, 0.999]

  # 学习率调度：CosineAnnealing
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [50000]
    restart_weights: [1]
    eta_min: 0.00001  # 1e-5（最佳配置）

  total_iter: 50000
  warmup_iter: -1

  # 损失函数：PoissonNLLLoss（最佳配置）
  pixel_opt:
    type: PoissonNLLLoss
    loss_weight: 1.0
    reduction: mean
    eps: 1e-9
    max_value: 60.0
    norm_type: linear  # 必须与数据归一化一致

# ============================================================================
# 验证配置
# ============================================================================
val:
  val_freq: 1000
  save_img: true
  eval_networks: [g, ema]
  save_img_networks: [ema]
  pbar: false
  suffix: null
  metric_domain: count
  save_best_ckpt: true
  best_metric: psnr_cnt_ema

  # SPECT 可视化
  spect_vis:
    enable: true
    vmax_cnt: 60.0
    vlim_res: 20.0
    vlim_anscombe: 1.0

  # Enable GIF generation for 3D projection data
  # Note: For dual-channel training, validation uses SPECTProjectionDataset
  # which loads raw ProjectionImage*.dat files directly
  generate_gif: true
  gif_output_dir: experiments/{name}/visualization/gifs
  max_gifs_per_val: 3  # Limit number of GIFs per validation

  # Override validation dataset to use raw projection files
  # (This will be used by SPECT3DModel for GIF generation)
  projection_val:
    type: SPECTProjectionDataset
    dataroot: datasets/bone_20230327
    pattern: "**/20s-1/ProjectionImage1.dat"
    height: 128
    width: 128
    views: 60
    start_idx: 0
    end_idx: 3

  # 评估指标
  metrics:
    psnr_cnt:
      type: calculate_psnr_range
      domain: count
      data_range: 60.0
      crop_border: 0
      test_y_channel: false
      better: higher

    ssim_cnt:
      type: calculate_ssim_range
      domain: count
      data_range: 60.0
      crop_border: 0
      test_y_channel: false
      better: higher

    lpips:
      type: calculate_lpips
      domain: count
      better: lower
      lpips_net: vgg
      lpips_local_repeat_n: 10

    poisson_fit:
      type: calculate_poisson_fit
      domain: count
      bin_center: nearest_int
      bin_size: 1.0
      min_pixels_per_bin: 512
      min_gt: 0.5
      better: lower

# ============================================================================
# 日志配置
# ============================================================================
logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  use_tb_logger: true
  print_eta: false
  keep_ckpt_num: 2
  keep_state_num: 2
  wandb:
    project: bone_spect_denoising
    resume_id: null

# ============================================================================
# 分布式训练配置
# ============================================================================
dist_params:
  backend: nccl
  port: 29500



