# Bone (real) single-view N2N config with Restormer + Edge-Preserving Loss
# Based on: n2n_bone_proj_20s_singleview_sota_edge_restormer.yml
# Modified for better Restormer performance:
#   - Patch size: 64 -> 128 (Transformer benefits from larger receptive field)
#   - Total iterations: 100k -> 200k (more training for Transformer)
#   - Batch size: 16 -> 8 (reduced due to larger patch size memory usage)
#   - Network dim: 32 -> 40 (slightly increased capacity for larger patches)
#   - Scheduler periods: [100000] -> [200000] (match total_iter)
#
# Rationale:
#   - Restormer (Transformer) architecture benefits from larger patches
#   - Larger patches provide better context for self-attention mechanism
#   - More iterations needed for Transformer to fully converge
#   - Slightly larger network capacity helps with larger input size

name: n2n_bone_proj_20s_singleview_sota_edge_restormer_patch128
model_type: SPECT3DModel  # Use SPECT3DModel for automatic GIF generation during validation
scale: 1
num_gpu: 1
manual_seed: 20020113

datasets:
  train:
    name: Bone_train_n2n_single
    type: SPECTDatPairedDataset
    mode: n2n
    dataroot_gt: datasets/bone_projection_20s_dat
    height: 128
    width: 128

    # single-view samples (H,W,1)
    view_mode: split1
    view_select: both
    posterior_flip: false

    n2n_p: 0.5
    n2n_random_swap: false
    n2n_round: nearest

    # For bone data, max counts are sparse; you can tune this (60/100/150).
    max_value: 100.0
    clip_max_value: false
    norm:
      type: linear

    # Restormer: use patch 128x128 (larger for Transformer)
    gt_size: 128  # ⭐ Increased from 64 to 128 for better Transformer performance
    use_hflip: false
    use_rot: false

    start_idx: 0
    end_idx: 810

    num_worker_per_gpu: 8
    batch_size_per_gpu: 8  # ⭐ Reduced from 16 to 8 (patch 128 uses ~4x memory of patch 64)
    dataset_enlarge_ratio: 4
    pin_memory: true
    persistent_workers: true
    prefetch_mode: null

  # Validation dataset (must be in datasets section for create_train_val_dataloader)
  val:
    name: Bone_val_projection
    type: SPECTProjectionDataset  # Direct loading of raw projection files
    dataroot: datasets/bone_20230327  # Root directory for projection files
    pattern: "**/20s-1/ProjectionImage1.dat"  # Glob pattern to find projection files
    height: 128
    width: 128
    views: 60

    start_idx: 0
    end_idx: 3  # Use first 3 projection files for validation

    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    pin_memory: true

    # Enable GIF generation for 3D data
    generate_gif: true
    gif_output_dir: experiments/{name}/visualization/gifs
    max_gifs_per_val: 3  # Limit number of GIFs per validation

    # No metrics for real data without clean GT
    metrics: null

network_g:
  type: Restormer
  inp_channels: 1  # Single channel for SPECT
  out_channels: 1  # Single channel output
  dim: 40  # ⭐ Increased from 32 to 40 (slightly larger capacity for patch 128)
  num_blocks: [3, 4, 4, 6]  # Number of transformer blocks at each level
  num_refinement_blocks: 3  # Number of refinement blocks
  heads: [1, 2, 4, 8]  # Number of attention heads at each level
  ffn_expansion_factor: 2.66  # FFN expansion factor
  bias: false  # No bias in convolutions
  LayerNorm_type: WithBias  # LayerNorm type: 'WithBias' or 'BiasFree'
  dual_pixel_task: false  # Not dual-pixel task
  global_residual: true  # ⭐ ENABLED: output = network_output + input (same as UNetRes in edge config)

path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null

train:
  ema_decay: 0.999
  pbar: true

  optim_g:
    type: AdamW
    lr: 0.0001
    weight_decay: 0.0001  # Critical for overfitting prevention
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [200000]  # ⭐ Increased from [100000] to match total_iter
    restart_weights: [1]
    eta_min: 1.0e-05  # Not too small, prevents late-stage damage

  total_iter: 200000  # ⭐ Increased from 100000 to 200000 (more training for Transformer)
  warmup_iter: -1

  pixel_opt:
    type: PoissonNLLLoss
    loss_weight: 1.0
    reduction: mean
    eps: 1.0e-09
    max_value: 100.0
    norm_type: linear  # Linear normalization (optimal for PoissonNLLLoss)

  # Gradient Loss: preserves edge sharpness by matching gradients
  # For N2N training: use input (lq) as reference instead of noisy GT
  # This helps maintain clear edges (e.g., spine) despite network's smoothing
  gradient_opt:
    type: GradientLoss
    loss_weight: 0.05  # Weight for gradient loss (tune: 0.01-0.1, lower for N2N)
    reduction: mean
    use_input_as_ref: true  # Use input (lq) as reference for N2N training

  # TV Regularization: VERY LOW weight
  # Reduced to allow sharper edges while still providing some smoothing
  tv_opt:
    type: WeightedTVLoss
    loss_weight: 0.001  # Very low weight (reduced from 0.01)
    reduction: mean
  # Option: Remove TV loss completely if edges still too smooth
  # (comment out tv_opt section above)

# Validation configuration (val_freq and other settings)
# Note: Validation dataset is defined in datasets.val above
val:
  val_freq: 2000  # ⭐ Validate every 2000 iterations (less frequent due to longer training)
  save_img: false  # We generate GIFs instead of saving individual images

logger:
  print_freq: 100
  save_checkpoint_freq: 2000  # ⭐ Save checkpoint every 2000 iterations
  use_tb_logger: true
  print_eta: false
  keep_ckpt_num: 2
  keep_state_num: 2
  wandb: null

dist_params:
  backend: nccl
  port: 29500

auto_resume: true





