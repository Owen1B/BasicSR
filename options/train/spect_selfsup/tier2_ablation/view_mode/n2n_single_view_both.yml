# ============================================================================
# Tier 2 Ablation: Single View (Both views treated separately)
# ============================================================================
# 测试: 单视角去噪 vs 双视角联合去噪
# 配置: view_mode=split1, view_select=both
# 效果: 数据集大小翻倍 (96→192), 每个视角独立处理
# 对比: Baseline 使用 stack2 (双视角联合)
# ============================================================================

name: n2n_single_view_both

model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 20020113

datasets:
  train:
    name: XCAT_train_n2n
    type: SPECTDatPairedDataset
    mode: n2n
    dataroot_gt: datasets/spectH_XCAT_poisson_1x
    height: 1024
    width: 256
    posterior_flip: true

    view_mode: split1          # Single view mode
    view_select: both          # Use both views as separate samples
    start_idx: 0
    end_idx: 96

    n2n_p: 0.5
    n2n_random_swap: false
    n2n_round: nearest

    gt_scale_factor: 1.0
    max_value: 150.0
    norm:
      type: linear

    gt_size: 64
    use_hflip: false
    use_rot: false

    num_worker_per_gpu: 8
    batch_size_per_gpu: 32
    dataset_enlarge_ratio: 2   # Reduced from 4 since dataset doubled (192 samples)
    pin_memory: true
    persistent_workers: true
    prefetch_mode: ~

  val:
    name: XCAT_val_paired
    type: SPECTDatPairedDataset
    mode: paired
    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    dataroot_gt: datasets/spectH_XCAT_ideal_1x
    height: 1024
    width: 256
    posterior_flip: true
    view_mode: split1
    view_select: both
    force_stack_for_val: true  # ✅ Stack both views for validation (enable visualization)
    start_idx: 96
    end_idx: 100

    gt_scale_factor: 1.0
    max_value: 150.0
    norm:
      type: linear

network_g:
  type: UNetRes
  in_nc: 1    # Single channel input
  out_nc: 1   # Single channel output
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  pbar: true

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [50000]
    restart_weights: [1]
    eta_min: !!float 1e-5

  total_iter: 50000
  warmup_iter: -1

  pixel_opt:
    type: PoissonNLLLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-9
    max_value: 150.0
    norm_type: linear

val:
  val_freq: 1000
  save_img: false

  eval_networks: [g, ema]
  save_img_networks: [ema]
  pbar: false
  suffix: ~
  metric_domain: count

  save_best_ckpt: true
  best_metric: psnr_cnt_ema

  spect_vis:
    enable: true
    vmax_cnt: 150.0
    vlim_res: 30.0
    vlim_anscombe: 1.0

  metrics:
    psnr_cnt:
      type: calculate_psnr_range
      domain: count
      data_range: 150.0
      crop_border: 0
      test_y_channel: false
      better: higher

    ssim_cnt:
      type: calculate_ssim_range
      domain: count
      data_range: 150.0
      crop_border: 0
      test_y_channel: false
      better: higher

    lpips:
      type: calculate_lpips
      domain: count
      better: lower
      lpips_net: vgg
      lpips_local_repeat_n: 10

    poisson_fit:
      type: calculate_poisson_fit
      domain: count
      bin_center: nearest_int
      bin_size: 1.0
      min_pixels_per_bin: 512
      min_gt: 0.5
      better: lower

logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  use_tb_logger: true
  print_eta: false
  keep_ckpt_num: 2
  keep_state_num: 2
  wandb:
    project: spect_selfsup_denoising
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
