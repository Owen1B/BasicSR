# =============================================================================
# N2B Baseline Configuration (Neighbor2Neighbor)
# =============================================================================
# Neighbor2Neighbor using spatial downsampling from 2x2 blocks.
#
# Key differences from N2N baseline:
# - Uses Neighbor2NeighborModel
# - Uses Neighbor2NeighborDataset
# - Additional lambda1, lambda2, increase_ratio parameters
# =============================================================================

name: n2b_baseline
model_type: Neighbor2NeighborModel
scale: 1
num_gpu: 1
manual_seed: 20020113

# =============================================================================
# Datasets
# =============================================================================
datasets:
  train:
    name: XCAT_train_n2b
    type: Neighbor2NeighborDataset
    mode: paired  # Uses single noisy image

    # Data paths (same path for LQ and GT - self-supervised)
    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    dataroot_gt: datasets/spectH_XCAT_poisson_1x
    height: 1024
    width: 256

    # View handling
    posterior_flip: true
    view_mode: stack2

    # Data split
    start_idx: 0
    end_idx: 96

    # Normalization
    gt_scale_factor: 1.0
    max_value: 150.0
    norm:
      type: linear

    # Data augmentation
    gt_size: 64
    use_hflip: false
    use_rot: false

    # Dataloader
    num_worker_per_gpu: 8
    batch_size_per_gpu: 32
    dataset_enlarge_ratio: 4
    pin_memory: true
    persistent_workers: true
    prefetch_mode: null

  val:
    name: XCAT_val_paired
    type: SPECTDatPairedDataset
    mode: paired

    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    dataroot_gt: datasets/spectH_XCAT_ideal_1x
    height: 1024
    width: 256

    posterior_flip: true
    view_mode: stack2

    start_idx: 96
    end_idx: 100

    gt_scale_factor: 1.0
    max_value: 150.0
    norm:
      type: linear

# =============================================================================
# Network Architecture (same as N2N baseline)
# =============================================================================
network_g:
  type: UNetRes
  in_nc: 2
  out_nc: 2
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true

# =============================================================================
# Training Configuration
# =============================================================================
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null

train:
  ema_decay: 0.999
  pbar: true

  optim_g:
    type: AdamW
    lr: 1.0e-4
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [50000]
    restart_weights: [1]
    eta_min: 1.0e-5

  total_iter: 50000
  warmup_iter: -1

  # N2B specific parameters
  lambda1: 1.0          # Reconstruction loss weight
  lambda2: 1.0          # Regularization loss weight
  increase_ratio: 2.0   # Lambda increases from 0 to increase_ratio during training

  # Loss function
  pixel_opt:
    type: PoissonNLLLoss
    loss_weight: 1.0
    reduction: mean
    eps: 1.0e-9
    max_value: 150.0
    norm_type: linear

# =============================================================================
# Validation Configuration
# =============================================================================
val:
  val_freq: 1000
  save_img: false
  eval_networks: [g, ema]
  save_img_networks: [ema]
  pbar: false
  suffix: null
  metric_domain: count
  save_best_ckpt: true
  best_metric: psnr_cnt_ema

  spect_vis:
    enable: true
    vmax_cnt: 150.0
    vlim_res: 30.0
    vlim_anscombe: 1.0

  metrics:
    psnr_cnt:
      type: calculate_psnr_range
      domain: count
      data_range: 150.0
      crop_border: 0
      test_y_channel: false
      better: higher
    ssim_cnt:
      type: calculate_ssim_range
      domain: count
      data_range: 150.0
      crop_border: 0
      test_y_channel: false
      better: higher

# =============================================================================
# Logging
# =============================================================================
logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  use_tb_logger: true
  print_eta: false
  keep_ckpt_num: 2
  keep_state_num: 2
  wandb:
    project: spect_selfsup_denoising
    resume_id: null

dist_params:
  backend: nccl
  port: 29500

