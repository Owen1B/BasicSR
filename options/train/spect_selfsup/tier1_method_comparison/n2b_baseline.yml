# ============================================================================
# Tier 1: N2B Baseline (Neighbor2Neighbor)
# ============================================================================
# 方法: Neighbor2Neighbor - 单图训练，空间下采样
# 配置: Anscombe归一化 + Charbonnier损失（原版实现）
# 特点: 不需要配对数据，双loss策略（重建 + 正则化）
# ============================================================================

name: n2b_baseline

model_type: Neighbor2NeighborModel
scale: 1

num_gpu: 1
manual_seed: 20020113

datasets:
  train:
    name: XCAT_train_n2b
    type: Neighbor2NeighborDataset
    mode: paired
    dataroot_gt: datasets/spectH_XCAT_poisson_1x
    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    height: 1024
    width: 256
    posterior_flip: true

    view_mode: stack2
    start_idx: 0
    end_idx: 96

    gt_scale_factor: 1.0
    max_value: 150.0
    norm:
      type: anscombe
      inverse: unbiased

    gt_size: 256  # Must be even (N2B requires 2×2 blocks)
    use_hflip: false
    use_rot: false

    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    pin_memory: true
    persistent_workers: true
    prefetch_mode: ~

  val:
    name: XCAT_val_paired
    type: SPECTDatPairedDataset
    mode: paired
    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    dataroot_gt: datasets/spectH_XCAT_ideal_1x
    height: 1024
    width: 256
    posterior_flip: true
    view_mode: stack2
    start_idx: 96
    end_idx: 100

    gt_scale_factor: 1.0
    max_value: 150.0
    norm:
      type: anscombe
      inverse: unbiased

network_g:
  type: UNetRes
  in_nc: 2
  out_nc: 2
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  pbar: true

  # N2B specific loss parameters
  lambda1: 1.0  # Reconstruction loss weight
  lambda2: 1.0  # Regularization loss weight
  increase_ratio: 0.5  # Lambda growth ratio (reduced from 2.0 to prevent reg loss explosion)

  optim_g:
    type: AdamW
    lr: !!float 3e-4  # N2B paper uses 3e-4
    weight_decay: !!float 1e-4  # Critical for preventing overfitting
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [10000, 20000, 30000, 40000]
    gamma: 0.5

  total_iter: 50000
  warmup_iter: -1

  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-12

val:
  val_freq: 200
  save_img: false

  eval_networks: [g, ema]
  save_img_networks: [ema]
  pbar: false
  suffix: ~
  metric_domain: count

  save_best_ckpt: true
  best_metric: psnr_cnt_ema

  spect_vis:
    enable: true
    vmax_cnt: 150.0
    vlim_res: 20.0
    vlim_anscombe: 1.0

  metrics:
    psnr_cnt:
      type: calculate_psnr_range
      domain: count
      data_range: 150.0
      crop_border: 0
      test_y_channel: false
      better: higher

    ssim_cnt:
      type: calculate_ssim_range
      domain: count
      data_range: 150.0
      crop_border: 0
      test_y_channel: false
      better: higher

    lpips:
      type: calculate_lpips
      domain: count
      better: lower
      lpips_net: vgg
      lpips_local_repeat_n: 10

    poisson_fit:
      type: calculate_poisson_fit
      domain: count
      bin_center: nearest_int
      bin_size: 1.0
      min_pixels_per_bin: 512
      min_gt: 0.5
      better: lower

logger:
  print_freq: 10
  save_checkpoint_freq: 200
  use_tb_logger: true
  print_eta: false
  keep_ckpt_num: 2
  keep_state_num: 2
  wandb:
    project: spect_selfsup_denoising
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
