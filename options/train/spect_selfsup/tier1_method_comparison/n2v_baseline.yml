# ============================================================================
# Tier 1: N2V Baseline (Noise2Void)
# ============================================================================
# 方法: Noise2Void - 单图训练，盲点网络
# 配置: Anscombe归一化 + Charbonnier损失（原版实现）
# 特点: 不需要配对数据，可直接用1x图像
# ============================================================================

name: n2v_baseline

model_type: Noise2VoidModel  # CRITICAL: Must use Noise2VoidModel for masked loss
scale: 1

num_gpu: 1
manual_seed: 20020113

datasets:
  train:
    name: XCAT_train_n2v
    type: Noise2VoidDataset  # CRITICAL: Must use Noise2VoidDataset for mask generation
    mode: paired  # N2V uses paired mode internally but generates mask
    dataroot_gt: datasets/spectH_XCAT_poisson_1x
    dataroot_lq: datasets/spectH_XCAT_poisson_1x  # Same as GT (single image)
    height: 1024
    width: 256
    posterior_flip: true

    view_mode: stack2
    start_idx: 0
    end_idx: 96

    # N2V specific parameters
    n2v_ratio: 0.9  # Keep 90% unmask, mask 10% for loss
    n2v_window_size: [5, 5]  # Neighborhood window for replacement

    gt_scale_factor: 1.0
    max_value: 150.0
    norm:
      type: anscombe
      inverse: unbiased

    gt_size: 256
    use_hflip: false
    use_rot: false

    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    pin_memory: true
    persistent_workers: true
    prefetch_mode: ~

  val:
    name: XCAT_val_paired
    type: SPECTDatPairedDataset
    mode: paired
    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    dataroot_gt: datasets/spectH_XCAT_ideal_1x
    height: 1024
    width: 256
    posterior_flip: true
    view_mode: stack2
    start_idx: 96
    end_idx: 100

    gt_scale_factor: 1.0
    max_value: 150.0
    norm:
      type: anscombe
      inverse: unbiased

network_g:
  type: UNetRes
  in_nc: 2
  out_nc: 2
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true
  # N2V uses blind-spot receptive field (implemented via masking)

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  pbar: true

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4  # Critical for preventing overfitting
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [50000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 50000
  warmup_iter: -1

  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-12

val:
  val_freq: 200
  save_img: false

  eval_networks: [g, ema]
  save_img_networks: [ema]
  pbar: false
  suffix: ~
  metric_domain: count

  save_best_ckpt: true
  best_metric: psnr_cnt_ema

  spect_vis:
    enable: true
    vmax_cnt: 150.0
    vlim_res: 20.0
    vlim_anscombe: 1.0

  metrics:
    psnr_cnt:
      type: calculate_psnr_range
      domain: count
      data_range: 150.0
      crop_border: 0
      test_y_channel: false
      better: higher

    ssim_cnt:
      type: calculate_ssim_range
      domain: count
      data_range: 150.0
      crop_border: 0
      test_y_channel: false
      better: higher

    lpips:
      type: calculate_lpips
      domain: count
      better: lower
      lpips_net: vgg
      lpips_local_repeat_n: 10

    poisson_fit:
      type: calculate_poisson_fit
      domain: count
      bin_center: nearest_int
      bin_size: 1.0
      min_pixels_per_bin: 512
      min_gt: 0.5
      better: lower

logger:
  print_freq: 10
  save_checkpoint_freq: 200
  use_tb_logger: true
  print_eta: false
  keep_ckpt_num: 2
  keep_state_num: 2
  wandb:
    project: spect_selfsup_denoising
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
