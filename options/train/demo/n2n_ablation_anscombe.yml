# ============================================================================
# N2N Ablation: Anscombe Normalization
# ============================================================================
# 目的: 测试 Anscombe 归一化对泊松噪声的影响 (⭐⭐⭐)
#
# 消融变化 (相对于 n2n_base_aligned_kair.yml):
#   - norm.type: linear → anscombe (唯一改变)
#   - max_value: 150.0 → 100.0 (Anscombe变换后的合理范围)
#   - pixel_opt.norm_type: linear → anscombe (loss函数需要知道norm类型)
#   - 所有 data_range / vmax_cnt: 150.0 → 100.0 (匹配新的max_value)
#
# 预期结果:
#   Anscombe变换稳定方差，让泊松噪声→高斯噪声
#   但可能在高计数区域引入失真
#   与 PoissonNLL loss 组合可能不完美匹配
# ============================================================================

name: n2n_ablation_anscombe

model_type: SRModel
scale: 1

num_gpu: 1
manual_seed: 20020113

datasets:
  train:
    name: XCAT_train_n2n
    type: SPECTDatPairedDataset
    mode: n2n
    dataroot_gt: datasets/spectH_XCAT_poisson_1x
    height: 1024
    width: 256
    posterior_flip: true

    view_mode: stack2
    start_idx: 0
    end_idx: 96

    # N2N split config
    n2n_p: 0.5
    n2n_random_swap: false
    n2n_round: nearest

    gt_scale_factor: 1.0
    max_value: 100.0  # ⚠️ 消融: 改为 100 (Anscombe范围)
    norm:
      type: anscombe  # ⚠️ 消融: 使用 Anscombe 归一化
      inverse: unbiased

    gt_size: 64

    use_hflip: false
    use_rot: false

    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    pin_memory: true
    persistent_workers: true
    prefetch_mode: ~

  val:
    name: XCAT_val_paired
    type: SPECTDatPairedDataset
    mode: paired
    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    dataroot_gt: datasets/spectH_XCAT_ideal_1x
    height: 1024
    width: 256
    posterior_flip: true
    view_mode: stack2
    start_idx: 96
    end_idx: 100

    gt_scale_factor: 1.0
    max_value: 100.0  # 匹配训练集
    norm:
      type: anscombe
      inverse: unbiased

network_g:
  type: UNetRes
  in_nc: 2
  out_nc: 2
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  pbar: true

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [50000]
    restart_weights: [1]
    eta_min: !!float 1e-5

  total_iter: 50000
  warmup_iter: -1

  pixel_opt:
    type: PoissonNLLLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-9
    max_value: 100.0  # 匹配训练集
    norm_type: anscombe  # ⚠️ 消融: 告诉loss函数使用anscombe
    anscombe_inverse: unbiased

val:
  val_freq: 1000
  save_img: true

  eval_networks: [g, ema]
  save_img_networks: [ema]
  pbar: false
  suffix: ~
  metric_domain: count

  save_best_ckpt: true
  best_metric: psnr_cnt_ema

  spect_vis:
    enable: true
    vmax_cnt: 100.0  # 匹配max_value
    vlim_res: 20.0   # 调整为100的比例
    vlim_anscombe: 1.0

  metrics:
    psnr_cnt:
      type: calculate_psnr_range
      domain: count
      data_range: 100.0  # 匹配max_value
      crop_border: 0
      test_y_channel: false
      better: higher

    ssim_cnt:
      type: calculate_ssim_range
      domain: count
      data_range: 100.0  # 匹配max_value
      crop_border: 0
      test_y_channel: false
      better: higher

    lpips:
      type: calculate_lpips
      domain: count
      better: lower
      lpips_net: vgg
      lpips_local_repeat_n: 10

    poisson_fit:
      type: calculate_poisson_fit
      domain: count
      bin_center: nearest_int
      bin_size: 1.0
      min_pixels_per_bin: 512
      min_gt: 0.5
      better: lower

logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  use_tb_logger: true
  print_eta: false
  keep_ckpt_num: 10
  keep_state_num: 5
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
