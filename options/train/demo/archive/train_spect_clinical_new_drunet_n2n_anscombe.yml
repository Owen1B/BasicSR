# Clinical SPECT (Noise2Noise) training using DRUNet-style residual U-Net backbone.
# - Train: one directory only (counts in .dat float32), Poisson/Binomial splitting per-pixel for N2N.
# - Val: use paired XCAT Poisson vs Ideal to report metrics in count domain.

name: spect_clinical_new_drunet_n2n_anscombe
model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: clinical_new_train_n2n
    type: SPECTDatPairedDataset
    mode: n2n
    dataroot_gt: datasets/spectH_clinical_new   # single input directory for N2N
    height: 1024
    width: 256
    posterior_flip: true

    view_mode: stack2
    # Split for train/val within clinical (optional). Here: first 180 for train.
    start_idx: 0
    end_idx: 180

    # N2N binomial split options
    n2n_p: 0.5
    n2n_random_swap: true
    n2n_round: nearest   # nearest | floor

    gt_scale_factor: 1.0
    max_value: 100.0
    norm:
      type: anscombe
      inverse: unbiased

    # patch training; set gt_size: ~ for full-image training
    gt_size: 256
    use_hflip: false
    use_rot: false

    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    pin_memory: true
    persistent_workers: true
    prefetch_mode: ~

  val:
    name: XCAT_val_paired
    type: SPECTDatPairedDataset
    mode: paired
    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    dataroot_gt: datasets/spectH_XCAT_ideal_1x
    height: 1024
    width: 256
    posterior_flip: true
    view_mode: stack2

    # last 10 for evaluation
    start_idx: 90
    end_idx: 100

    gt_scale_factor: 1.0
    max_value: 100.0
    norm:
      type: anscombe
      inverse: unbiased

network_g:
  type: UNetRes
  in_nc: 2
  out_nc: 2
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  # global residual denoiser: y = x + f(x)
  global_residual: true

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  # tqdm progress bar during training (rank0 only)
  pbar: true

  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [20000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 20000
  warmup_iter: -1

  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-12

val:
  val_freq: 200
  save_img: true

  # Evaluate both raw G and EMA during validation for comparison.
  eval_networks: [g, ema]
  # Save visualization grids/images for these networks.
  save_img_networks: [g, ema]

  # tqdm progress bar during validation/testing (optional)
  pbar: false
  suffix: ~

  # Metrics will be computed in this domain:
  # - norm: Anscombe/normalized domain
  # - count: inverse-normalized count domain
  metric_domain: count

  # SPECT visualization settings (2 rows x 7 cols grid)
  spect_vis:
    enable: true
    vmax_cnt: 100.0       # shared vmax for count-domain images
    vlim_res: 20.0        # diverging limits for count-domain residual/error/noise
    vlim_anscombe: 1.0    # diverging limits for Anscombe-domain residual

  metrics:
    psnr_cnt:
      type: calculate_psnr_range
      domain: count
      data_range: 100.0
      crop_border: 0
      test_y_channel: false
      better: higher

    ssim_cnt:
      type: calculate_ssim_range
      domain: count
      data_range: 100.0
      crop_border: 0
      test_y_channel: false
      better: higher

    lpips:
      type: calculate_lpips
      domain: count
      better: lower
      lpips_net: vgg
      lpips_local_repeat_n: 10

    poisson_fit:
      type: calculate_poisson_fit
      domain: count
      bin_center: nearest_int
      bin_size: 1.0
      min_pixels_per_bin: 512
      min_gt: 0.5
      better: lower

logger:
  print_freq: 10
  save_checkpoint_freq: 200
  use_tb_logger: true
  # INFO logs should not print ETA/time (our logger supports this flag)
  print_eta: false
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500


