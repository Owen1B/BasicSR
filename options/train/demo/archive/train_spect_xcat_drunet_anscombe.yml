# XCAT SPECT planar denoising (paired) using DRUNet-style residual U-Net backbone.
# - LQ: datasets/spectH_XCAT_poisson_1x
# - GT: datasets/spectH_XCAT_ideal_1x
# - Data is .dat float32 counts shaped (2,1024,256); posterior is flipped to align.
# - Training in Anscombe domain; evaluation in count domain (inverse Anscombe) with data_range=max_value.

name: spect_xcat_drunet_anscombe
model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: XCAT_train
    type: SPECTDatPairedDataset
    mode: paired
    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    dataroot_gt: datasets/spectH_XCAT_ideal_1x
    height: 1024
    width: 256
    posterior_flip: true

    view_mode: stack2
    # To ablate single-view training, switch to:
    # view_mode: split1
    # view_select: anterior_only  # or posterior_only / both

    # Train/val split by slicing:
    # - first 90 for training
    start_idx: 0
    end_idx: 90

    # Scale GT dose to match LQ dose level before normalization/Anscombe (set to 1.0 if already matched)
    gt_scale_factor: 1.0

    # Peak value in the scaled count domain (used for normalization + metrics data_range).
    # IMPORTANT: set this to a meaningful constant for your energy window.
    max_value: 100.0

    norm:
      type: anscombe        # linear | anscombe
      inverse: unbiased     # algebraic | unbiased (Makitalo-Foi)

    # patch training; for full-image training set gt_size: ~
    gt_size: 256
    use_hflip: false
    use_rot: false

    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    pin_memory: true
    persistent_workers: true
    prefetch_mode: ~

  val:
    name: XCAT_val
    type: SPECTDatPairedDataset
    mode: paired
    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    dataroot_gt: datasets/spectH_XCAT_ideal_1x
    height: 1024
    width: 256
    posterior_flip: true
    view_mode: stack2

    # Use last 10 for evaluation
    start_idx: 90
    end_idx: 100

    gt_scale_factor: 1.0
    max_value: 100.0
    norm:
      type: anscombe
      inverse: unbiased

network_g:
  type: UNetRes
  in_nc: 2
  out_nc: 2
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  # global residual denoiser: y = x + f(x)
  global_residual: true

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  # tqdm progress bar during training (rank0 only)
  pbar: true
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [20000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 20000
  warmup_iter: -1

  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-12

val:
  val_freq: 200
  save_img: true
  # Evaluate both raw G and EMA during validation for comparison.
  eval_networks: [g, ema]
  # Save visualization grids/images for these networks.
  # Set to [ema] if you want to save disk; set to [g, ema] to compare directly.
  save_img_networks: [g, ema]
  pbar: false
  suffix: ~
  metric_domain: count   # norm | count
  spect_vis:
    enable: true
    # Count-domain display scaling (shared across all 3 count images: input/pred/label)
    vmax_cnt: 100.0
    # Residual diverging colormap limit; ~ means auto per-image
    vlim_res: ~

  metrics:
    psnr_cnt:
      type: calculate_psnr_range
      domain: count
      crop_border: 0
      input_order: HWC
      data_range: 100.0
      better: higher
    ssim_cnt:
      type: calculate_ssim_range
      domain: count
      crop_border: 0
      input_order: HWC
      data_range: 100.0
      better: higher
    lpips:
      type: calculate_lpips
      domain: count
      net: alex
      device: cuda
      channel_mode: avg
      better: lower
    poisson_fit:
      # Poisson conformity (lower is better; 0 = perfect):
      # compare Var(LQ-Pred) vs Mean(GT) after binning pixels by GT intensity.
      type: calculate_poisson_fit
      domain: count
      input_order: HWC
      bin_size: 1.0
      bin_center: nearest_int   # bins [k-0.5, k+0.5)
      min_pixels_per_bin: 512
      min_gt: 0.5
      better: lower

logger:
  print_freq: 10
  # Don't print ETA / time(data) in INFO logs (tqdm already shows progress/ETA).
  print_eta: false
  save_checkpoint_freq: 200
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500


