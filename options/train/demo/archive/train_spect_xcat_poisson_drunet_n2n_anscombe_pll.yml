# XCAT SPECT N2N 实验: 使用泊松PLL损失函数
# 基于原始配置，将 CharbonnierLoss 替换为 PoissonNLLLoss
# PoissonNLLLoss: 反归一化到计数域后，以模型输出作为λ，计算观测到输入的泊松概率

name: spect_xcat_poisson_drunet_n2n_anscombe_pll

model_type: SRModel
scale: 1

num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: XCAT_train_n2n
    type: SPECTDatPairedDataset
    mode: n2n
    dataroot_gt: datasets/spectH_XCAT_poisson_1x
    height: 1024
    width: 256
    posterior_flip: true

    view_mode: stack2
    start_idx: 0
    end_idx: 96

    n2n_p: 0.5
    n2n_random_swap: false
    n2n_round: nearest

    gt_scale_factor: 1.0
    max_value: 100.0
    norm:
      type: anscombe
      inverse: unbiased

    gt_size: 256
    use_hflip: false
    use_rot: false

    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    pin_memory: true
    persistent_workers: true
    prefetch_mode: ~

  val:
    name: XCAT_val_paired
    type: SPECTDatPairedDataset
    mode: paired
    dataroot_lq: datasets/spectH_XCAT_poisson_1x
    dataroot_gt: datasets/spectH_XCAT_ideal_1x
    height: 1024
    width: 256
    posterior_flip: true
    view_mode: stack2
    start_idx: 96
    end_idx: 100

    gt_scale_factor: 1.0
    max_value: 100.0
    norm:
      type: anscombe
      inverse: unbiased

network_g:
  type: UNetRes
  in_nc: 2
  out_nc: 2
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  pbar: true

  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [20000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 20000
  warmup_iter: -1

  # 使用泊松负对数似然损失
  # 模型预测（pred）作为泊松参数λ，计算观测到输入（target）的负对数似然
  pixel_opt:
    type: PoissonNLLLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-8
    max_value: 100.0
    norm_type: anscombe
    anscombe_inverse: unbiased

val:
  val_freq: 200
  save_img: true

  eval_networks: [g, ema]
  save_img_networks: [g, ema]
  pbar: false
  suffix: ~
  metric_domain: count

  # 保存最佳checkpoint
  save_best_ckpt: true
  best_metric: psnr_cnt_ema

  spect_vis:
    enable: true
    vmax_cnt: 100.0
    vlim_res: 20.0
    vlim_anscombe: 1.0

  metrics:
    psnr_cnt:
      type: calculate_psnr_range
      domain: count
      data_range: 100.0
      crop_border: 0
      test_y_channel: false
      better: higher

    ssim_cnt:
      type: calculate_ssim_range
      domain: count
      data_range: 100.0
      crop_border: 0
      test_y_channel: false
      better: higher

    lpips:
      type: calculate_lpips
      domain: count
      better: lower
      lpips_net: vgg
      lpips_local_repeat_n: 10

    poisson_fit:
      type: calculate_poisson_fit
      domain: count
      bin_center: nearest_int
      bin_size: 1.0
      min_pixels_per_bin: 512
      min_gt: 0.5
      better: lower

logger:
  print_freq: 10
  save_checkpoint_freq: 200
  use_tb_logger: true
  print_eta: false
  # 只保留最近5个checkpoint和training state
  keep_ckpt_num: 5
  keep_state_num: 5
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500

