# Debug run (100 iters) to check GPU memory for 3D UNet full-volume training (proj-only).
# NOTE: name contains "debug" so BasicSR disables remote loggers (wandb/tb) by convention in this repo.

name: debug_n2n_spect229_60view3d_unet_projonly_full_100iter
model_type: SPECT3DModel
scale: 1
num_gpu: 1
manual_seed: 20020113

datasets:
  train:
    name: spect229_train_60view_full
    type: SPECT60ViewVolumeDataset
    phase: train
    mode: n2n
    dataroot_gt: datasets/SPECT229
    pattern_gt: "**/*_Proj4Filter.dat"
    views: 60
    height: 128
    width: 128
    dtype: uint16
    max_value: 150.0
    gt_scale_factor: 1.0
    clip_max_value: false
    n2n_p: 0.5
    n2n_random_swap: false
    n2n_round: nearest

    start_idx: 4
    end_idx: 229

    num_worker_per_gpu: 2
    batch_size_per_gpu: 2
    pin_memory: true
    persistent_workers: true

  val:
    name: SPECT229_val_projection
    type: SPECTProjectionDataset
    phase: val
    dataroot: datasets/SPECT229
    pattern: "**/*_Proj4Filter.dat"
    height: 128
    width: 128
    views: 60
    start_idx: 0
    end_idx: 1
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    pin_memory: true

network_g:
  type: UNet3DRes
  in_nc: 1
  out_nc: 1
  nc: [32, 64, 128, 256]
  nb: 2
  bias: false
  global_residual: true
  circular_depth: true
  act: relu

path:
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~

train:
  pbar: true
  disable_cudnn: true
  amp:
    enable: false
    dtype: bf16
    loss_fp32: true
    use_scaler: false
  ema_decay: 0.999
  accumulation_steps: 8

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [100]
    restart_weights: [1]
    eta_min: !!float 1e-5

  total_iter: 100
  warmup_iter: -1

  pixel_opt:
    type: PoissonNLLLoss
    loss_weight: 1.0
    reduction: mean
    eps: 1.0e-09
    max_value: 150.0
    norm_type: linear

val:
  val_freq: 8
  save_img: false
  generate_gif: true
  gif_output_dir: experiments/{name}/visualization/gifs
  max_gifs_per_val: 1
  metrics: null

logger:
  print_freq: 1
  save_checkpoint_freq: 1000000
  use_tb_logger: false
  wandb: null


