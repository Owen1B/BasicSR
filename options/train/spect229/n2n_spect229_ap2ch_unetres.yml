# SPECT229 A/P paired projection denoising (2-channel 2D UNet)
# - Train input/output: (C,H,W) = (2,128,128)  [anterior + posterior]
# - posterior is flipped left-right to align with anterior (posterior_flip=true)
# - N2N via binomial split (Poisson splitting) in count domain
#
# Dataset: datasets/SPECT229_projection_paired
#   Each file: float32, shape (2,128,128):
#     ch0: anterior  (view_i)
#     ch1: posterior (view_i+30)  [will be flipped LR in dataset for alignment]

name: n2n_spect229_ap2ch_unetres
model_type: SPECT3DModel
scale: 1
num_gpu: 1
manual_seed: 20020113
auto_resume: true

datasets:
  train:
    name: spect229_train_ap2ch
    type: SPECTDatPairedDataset
    phase: train
    mode: n2n
    dataroot_gt: datasets/SPECT229_projection_paired
    height: 128
    width: 128

    # output tensors: (C,H,W) where C=2
    view_mode: stack2
    posterior_flip: true

    n2n_p: 0.5
    n2n_random_swap: false
    n2n_round: nearest

    max_value: 150.0
    clip_max_value: false
    norm:
      type: linear

    # patch training
    gt_size: 64

    # split: first 4 for val, remaining for train (229 patients * 30 pairs = 6870 samples)
    start_idx: 4
    end_idx: 6870

    num_worker_per_gpu: 16
    batch_size_per_gpu: 64
    dataset_enlarge_ratio: 4
    pin_memory: true
    persistent_workers: true

  # Validation: run on the original 60-view projections, but infer using the 2ch net by pairing/stitching.
  val:
    name: SPECT229_val_projection_60view
    type: SPECTProjectionDataset
    dataroot: datasets/SPECT229
    pattern: "**/*_Proj4Filter.dat"
    height: 128
    width: 128
    views: 60
    start_idx: 0
    end_idx: 4
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    pin_memory: true

network_g:
  type: UNetRes
  in_nc: 2
  out_nc: 2
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  pbar: true
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [200000]
    restart_weights: [1]
    eta_min: !!float 1e-5
  total_iter: 200000
  warmup_iter: -1

  pixel_opt:
    type: PoissonNLLLoss
    loss_weight: 1.0
    reduction: mean
    eps: 1.0e-09
    max_value: 150.0
    norm_type: linear

val:
  val_freq: 5000
  save_img: false
  generate_gif: true
  gif_output_dir: experiments/{name}/visualization/gifs
  max_gifs_per_val: 3
  infer_mode: auto            # auto | paired2ch | pair60_stitch
  max_value: 150.0            # fixed normalization for inference (must match training)
  # ---- LPIPS during validation (Poisson sample vs original) ----
  # This does NOT require clean GT; it measures perceptual difference between the original projection
  # and a Poisson-resampled version of the denoised-EMA output (diagnostic / calibration-like metric).
  compute_lpips_poisson_vs_original: true
  lpips_nets: [alex, vgg]
  lpips_poisson_repeats_alex: 100
  lpips_poisson_repeats_vgg: 10
  lpips_view_stride: 1
  lpips_max_value: 150.0
  metrics: null

logger:
  print_freq: 50
  save_checkpoint_freq: 1000
  keep_ckpt_num: 2
  keep_state_num: 2
  use_tb_logger: true
  wandb: null


