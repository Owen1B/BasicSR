# Debug (1 iter): N2N (PoissonNLL) + Low-dose (Anscombe-domain MSE), fixed factor=4
#
# Purpose:
# - Run exactly 1 optimizer step and print losses so you can calibrate weights.
# - Force low-dose loss to be active from iter=1 and use a fixed scaling factor s=4.0.
#
# Notes:
# - name contains "debug" so this repo convention disables remote loggers.
# - Keep val enabled but very infrequent to avoid extra time.

name: debug_n2n_spect229_singleview_patch64_lowdose_w20_anscombe_mse_factor4_1iter
model_type: SPECT3DConsistencyModel
scale: 1
num_gpu: 1
manual_seed: 20020113
auto_resume: false

datasets:
  train:
    name: SPECT229_train_n2n_single
    type: SPECTDatPairedDataset
    mode: n2n
    dataroot_gt: datasets/SPECT229_projection_paired
    height: 128
    width: 128

    view_mode: split1
    view_select: both
    posterior_flip: false

    n2n_p: 0.5
    n2n_random_swap: false
    n2n_round: nearest

    max_value: 150.0
    clip_max_value: false
    norm:
      type: linear

    # 多通道条件输入：lq = [proj, umap_integral, umap_mip]，gt 仍为 proj（单通道）
    # TEMPORARILY DISABLED for quick loss value check
    umap_aux:
      enable: false

    gt_size: 64
    use_hflip: false
    use_rot: false

    start_idx: 0
    end_idx: 6870

    num_worker_per_gpu: 2
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    pin_memory: true
    persistent_workers: true
    prefetch_mode: null

  val:
    name: SPECT229_val_projection
    type: SPECTProjectionDataset
    dataroot: datasets/SPECT229
    pattern: "**/*_Proj4Filter.dat"
    height: 128
    width: 128
    views: 60
    start_idx: 0
    end_idx: 1
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    pin_memory: true

network_g:
  type: UNetRes
  in_nc: 1  # TEMPORARILY 1-channel for quick loss value check
  out_nc: 1
  nc: [64, 128, 256, 512]
  nb: 4
  act_mode: R
  downsample_mode: strideconv
  upsample_mode: convtranspose
  bias: false
  global_residual: true

path:
  pretrain_network_g: experiments/n2n_spect229_singleview_patch64/models/net_g_latest.pth
  strict_load_g: false
  resume_state: null

train:
  ema_decay: 0.999
  pbar: true

  optim_g:
    type: AdamW
    lr: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [1]
    restart_weights: [1]
    eta_min: 1.0e-05

  total_iter: 1
  warmup_iter: -1

  pixel_opt:
    type: PoissonNLLLoss
    loss_weight: 1.0
    reduction: mean
    eps: 1.0e-09
    max_value: 150.0
    norm_type: linear

  # Consistency loss disabled
  consistency_opt:
    loss_weight: 0.0
    loss_type: l1
    start_iter: 1
    use_ema_teacher: true
    target: g_on_input
    detach_target: true
    domain: count
    norm_type: linear
    max_value: 150.0

  # Low-dose loss: fixed factor=4, Anscombe transform, MSE
  lowdose_opt:
    loss_weight: 20.0
    loss_type: mse
    start_iter: 1
    use_ema_teacher: true
    detach_target: true
    domain: anscombe
    norm_type: linear
    max_value: 150.0
    factor_min: 4.0
    factor_max: 4.0
    per_sample: false

val: null  # Disable validation for quick loss value check

logger:
  print_freq: 1
  save_checkpoint_freq: 99999999
  use_tb_logger: false
  wandb: null

dist_params:
  backend: nccl
  port: 29500


