# NEMA Single Projection Fine-tuning with Frequent Visualization
# 2000 iterations, checkpoint every 50 steps for GIF generation
# Optimized for 8GB GPU (RTX 4060 Ti)

name: finetune_nema_2k_visualize
model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 20020113

datasets:
  train:
    name: NEMA_single_train
    type: NEMASingleProjectionPatchDataset
    projection_file: datasets/NEMA/osem/ProjectionImage_Original.dat
    views: 120
    height: 256
    width: 256
    dtype: uint16
    max_value: 150.0

    # Mixed-dose N2N
    n2n_k_choices: [2, 3, 4, 5]
    virtual_dataset_size: 500

    # Smaller patches for 8GB GPU
    patch_size_v: 40
    patch_size_h: 96
    patch_size_w: 96

    # Augmentation
    use_flip: true
    use_rot: false

    # DataLoader - small batch for 8GB GPU
    num_worker_per_gpu: 2
    batch_size_per_gpu: 1
    pin_memory: true
    persistent_workers: true

  val:
    name: NEMA_single_val
    type: NEMASingleProjectionPatchDataset
    projection_file: datasets/NEMA/osem/ProjectionImage_Original.dat
    views: 120
    height: 256
    width: 256
    dtype: uint16
    max_value: 150.0
    n2n_k_choices: [2]
    virtual_dataset_size: 5
    patch_size_v: 40
    patch_size_h: 96
    patch_size_w: 96
    use_flip: false
    use_rot: false
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    pin_memory: true

network_g:
  type: UNet3DRes
  in_nc: 1
  out_nc: 1
  nc: [32, 64, 128, 256]
  nb: 4
  bias: false
  global_residual: true
  circular_depth: true
  act: relu

path:
  # Use the synced pretrained model
  pretrain_network_g: experiments/n2n_spect229_60view3d_unet_projonly_full_multidose_L_pretrain_from_Lk2_91k/models/net_g_best.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~

train:
  pbar: true
  disable_cudnn: false
  amp:
    enable: true  # Enable mixed precision for 8GB GPU
    dtype: float16
  ema_decay: 0.999
  accumulation_steps: 8  # Larger accumulation to compensate for small batch

  optim_g:
    type: AdamW
    lr: !!float 1e-6
    weight_decay: !!float 1e-5
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [2000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 2000
  warmup_iter: 50

  pixel_opt:
    type: PoissonNLLLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-9
    max_value: 150.0
    norm_type: linear

val:
  val_freq: 50
  save_img: false
  max_num_images: 5

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 10
  save_checkpoint_freq: 50
  keep_ckpt_num: 50
  keep_state_num: 2
  use_tb_logger: true
  wandb: ~
